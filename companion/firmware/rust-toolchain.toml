[toolchain]
# -Zbuild-std rebuilds std from the nightly's own source tree (needed for the
# no-std ESP32 target); a too-new nightly's std source can drift ahead of the
# libc crate version esp-idf-sys pins, breaking the host-side build-std pass
# too (e.g. a missing libc::AT_FDCWD). Bump deliberately, not via `rustup update`.
channel = "nightly-2025-11-01"
components = ["rust-src"]
