name: Android CI

# Android アプリの単体テストと全ソースのコンパイルを毎 push / PR で確認する。
# release.yml はタグ起点のビルド専用なので、そちらでは検証が走らない。
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # testDebugUnitTest は main と test を、assembleDebugAndroidTest は
      # 計測テストのソースをコンパイルする。後者は端末を必要としない。
      - name: Run unit tests
        working-directory: companion/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebugAndroidTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: companion/android/app/build/reports/tests/testDebugUnitTest
