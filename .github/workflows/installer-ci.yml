name: Installer CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_installer_ui.cjs
