name: Firmware CI

# ファームウェアのホストテスト（lib.rs が公開する純粋モジュールのみ）を毎 push / PR で確認する。
# ESP32 実機ターゲットのビルドは ESP-IDF 一式が要るため release.yml がタグ起点で別途行う。
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml が固定した nightly を使う。.cargo/config.toml の
      # デフォルトターゲットは ESP32 (riscv32imc-esp-espidf) なので、host 向け
      # ライブラリテストだけを対象にするには --target で明示的に上書きする。
      - name: Install pinned Rust toolchain
        working-directory: companion/firmware
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/firmware

      - name: Run host tests
        working-directory: companion/firmware
        run: cargo test --lib --target x86_64-unknown-linux-gnu
