name: Release & Deploy Installer

# A v* tag builds the three artifacts and attaches them to a Release. A push to main
# deploys installer/ to Pages: the github-pages environment refuses a deployment that
# comes from a tag.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # create the Release and attach its assets
  pages: write
  id-token: write   # OIDC for the Pages deployment

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1. Standalone firmware (clumo-standalone.bin)
  # ------------------------------------------------------------
  build-standalone:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ESP-IDF itself is not installed here: esp-idf-sys fetches it during the build.
      - name: Install Rust ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32c3
          ldproxy: true

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: standalone
          cache-directories: |
            standalone/.embuild
            ~/.espressif

      - name: Build (release)
        working-directory: standalone
        run: cargo build --release

      - name: Install espflash
        run: cargo install espflash --locked

      # --merge writes the bootloader, partition table and app as one image.
      - name: Generate merged firmware
        run: |
          espflash save-image \
            --chip esp32c3 \
            --merge \
            --flash-size 4mb \
            standalone/target/riscv32imc-esp-espidf/release/clumo-standalone \
            clumo-standalone.bin
          ls -lh clumo-standalone.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: clumo-standalone
          path: clumo-standalone.bin

  # ------------------------------------------------------------
  # 2. Companion firmware (clumo-companion.bin)
  # ------------------------------------------------------------
  build-companion:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32c3
          ldproxy: true

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/firmware
          cache-directories: |
            companion/firmware/.embuild
            ~/.espressif

      - name: Build (release)
        working-directory: companion/firmware
        run: cargo build --release

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Generate merged firmware
        run: |
          espflash save-image \
            --chip esp32c3 \
            --merge \
            --flash-size 4mb \
            companion/firmware/target/riscv32imc-esp-espidf/release/clumo-companion \
            clumo-companion.bin
          ls -lh clumo-companion.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: clumo-companion
          path: clumo-companion.bin

  # ------------------------------------------------------------
  # 3. Android app (clumo.apk)
  # ------------------------------------------------------------
  build-apk:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The signing material lives in this environment, which only v* tags may use.
    environment: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A missing secret fails here rather than reaching the point where an
      # unsigned APK could be published.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in android-release"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clumo-release.keystore"

      - name: Build APK (release)
        working-directory: companion/android
        env:
          CLUMO_KEYSTORE_PATH: ${{ runner.temp }}/clumo-release.keystore
          CLUMO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLUMO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLUMO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        env:
          CLUMO_SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          apk=$(find companion/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apk" && test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          expected=$(printf '%s' "$CLUMO_SIGNING_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK signing certificate does not match SIGNING_CERT_SHA256"
            exit 1
          fi
          cp "$apk" clumo.apk
          ls -lh clumo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clumo-apk
          path: clumo.apk

  # ------------------------------------------------------------
  # 4. Attach all three artifacts to the GitHub Release
  # ------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-standalone, build-companion, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/clumo-standalone.bin
            dist/clumo-companion.bin
            dist/clumo.apk
          generate_release_notes: true

  # ------------------------------------------------------------
  # 5. Deploy installer/ to GitHub Pages
  # ------------------------------------------------------------
  deploy-pages:
    # No needs: the page deploys even when no firmware was built.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release asset URLs carry no CORS headers, so ESP Web Tools cannot fetch them.
      # Serving the binaries from Pages puts them on the manifest's own origin.
      # The first run, before any Release exists, deploys the page alone.
      - name: Fetch latest firmware into installer/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bin in clumo-standalone.bin clumo-companion.bin; do
            if ! gh release download --repo "${{ github.repository }}" \
                --pattern "$bin" --dir installer --clobber; then
              echo "::warning::could not download $bin; deploying the page only"
            fi
          done
          ls -lh installer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: installer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
