name: Android CI

# release.yml only builds from a tag, so nothing there verifies the app.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleDebugAndroidTest compiles the instrumentation sources without a device.
      - name: Run unit tests
        working-directory: companion/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebugAndroidTest

      # Both tools have their existing findings frozen in a baseline, so only
      # newly introduced ones fail here.
      - name: Run static checks
        working-directory: companion/android
        run: ./gradlew ktlintCheck lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            companion/android/app/build/reports/lint-results-debug.html
            companion/android/app/build/reports/ktlint

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: companion/android/app/build/reports/tests/testDebugUnitTest
