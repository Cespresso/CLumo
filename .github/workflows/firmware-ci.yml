name: Firmware CI

# Only the host tests run here, over the pure modules lib.rs exposes. Building for
# the ESP32 target needs a whole ESP-IDF install, which release.yml sets up from a tag.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup show installs whatever nightly rust-toolchain.toml pins.
      - name: Install pinned Rust toolchain
        working-directory: companion/firmware
        run: rustup show

      # The tree is fmt-clean; keep it that way without anyone having to remember.
      - name: Check formatting
        working-directory: companion/firmware
        run: cargo fmt --check

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/firmware

      # .cargo/config.toml defaults the target to the ESP32, so the host tests
      # have to name theirs.
      - name: Run host tests
        working-directory: companion/firmware
        run: cargo test --lib --target x86_64-unknown-linux-gnu
